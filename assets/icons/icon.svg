<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f242d"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="#0a0c10"/>
  <circle cx="256" cy="256" r="210" fill="url(#bgGlow)" stroke="#eab308" stroke-width="6"/>
  <!-- Barbell Bar -->
  <rect x="136" y="244" width="240" height="24" rx="12" fill="url(#goldGrad)"/>
  <!-- Outer Plates Left -->
  <rect x="100" y="200" width="24" height="112" rx="8" fill="#ca8a04"/>
  <rect x="128" y="184" width="26" height="144" rx="8" fill="url(#goldGrad)"/>
  <!-- Outer Plates Right -->
  <rect x="358" y="184" width="26" height="144" rx="8" fill="url(#goldGrad)"/>
  <rect x="388" y="200" width="24" height="112" rx="8" fill="#ca8a04"/>
  <!-- Collars -->
  <rect x="158" y="226" width="16" height="60" rx="4" fill="#ffffff" opacity="0.9"/>
  <rect x="338" y="226" width="16" height="60" rx="4" fill="#ffffff" opacity="0.9"/>
  <!-- Center Diamond Badge -->
  <polygon points="256,210 302,256 256,302 210,256" fill="#0a0c10" stroke="#fde047" stroke-width="5"/>
  <text x="256" y="263" font-family="'Inter', sans-serif" font-weight="900" font-size="22" fill="#fde047" text-anchor="middle">AG</text>
